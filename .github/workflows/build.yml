name: Build Release APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Build release
        run: ./gradlew assembleRelease

      - name: Align and sign
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          $BT/apksigner sign \
            --ks $RUNNER_TEMP/release.jks \
            --ks-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --out app-release.apk aligned.apk
          $BT/apksigner verify app-release.apk
          rm $RUNNER_TEMP/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: app-release.apk
