name: Build Release APKs
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from app.json
        id: v
        run: |
          V=$(node -p "require('./app.json').expo.version")
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "app.json expo.version is not SemVer: '$V'" >&2
            exit 1
          fi
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "Tag v$V already exists — bump the version first." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing v$V"

  build-plain:
    needs: check-version
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SIGNAL_DETECTION: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate Android project without signal detection
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Align and sign plain APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner sign \
            --ks $RUNNER_TEMP/release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --out app-release-plain.apk "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner verify app-release-plain.apk
          rm $RUNNER_TEMP/release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-plain.apk
          path: app-release-plain.apk

  build-signal:
    needs: check-version
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SIGNAL_DETECTION: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate Android project with signal detection
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Align and sign private APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner sign \
            --ks $RUNNER_TEMP/release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --out app-release-sd-incl.apk "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner verify app-release-sd-incl.apk
          rm $RUNNER_TEMP/release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-sd-incl.apk
          path: app-release-sd-incl.apk

  release:
    needs: [check-version, build-plain, build-signal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-release-plain.apk

      - uses: actions/download-artifact@v4
        with:
          name: app-release-sd-incl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: private-signal-apk-v${{ needs.check-version.outputs.version }}
          path: app-release-sd-incl.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            app-release-plain.apk
