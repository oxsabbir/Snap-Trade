name: Build Release APKs
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history with tags: the duplicate-release check below must see every tag that
          # already exists on the remote, and the default shallow checkout fetches none.
          fetch-depth: 0

      - name: Resolve version from app.json
        id: v
        run: |
          V=$(node -p "require('./app.json').expo.version")
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "app.json expo.version is not SemVer: '$V'" >&2
            exit 1
          fi
          # Android requires a strictly increasing versionCode per installable build, so it —
          # not the SemVer alone — is the identity of a release: two builds of the same SemVer
          # with different codes are different APKs and both deserve their own release entry.
          C=$(node -p "require('./app.json').expo.android.versionCode")
          TAG="v$V-b$C"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — bump app.json version/versionCode first." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  build-plain:
    needs: check-version
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SIGNAL_DETECTION: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate Android project without signal detection
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Align and sign plain APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner sign \
            --ks $RUNNER_TEMP/release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --out app-release-plain.apk "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner verify app-release-plain.apk
          rm $RUNNER_TEMP/release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-plain.apk
          path: app-release-plain.apk

  build-signal:
    needs: check-version
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SIGNAL_DETECTION: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate Android project with signal detection
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Align and sign private APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner sign \
            --ks $RUNNER_TEMP/release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --out app-release-sd-incl.apk "$RUNNER_TEMP/aligned.apk"
          $BT/apksigner verify app-release-sd-incl.apk
          rm $RUNNER_TEMP/release.p12

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-sd-incl.apk
          path: app-release-sd-incl.apk

  release:
    needs: [check-version, build-plain, build-signal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-release-plain.apk

      - uses: actions/download-artifact@v4
        with:
          name: app-release-sd-incl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: private-signal-apk-v${{ needs.check-version.outputs.version }}-b${{ needs.check-version.outputs.code }}
          path: app-release-sd-incl.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # One release per installable build: the tag carries the versionCode, so older
          # releases stay listed with their own APKs instead of being overwritten.
          tag_name: v${{ needs.check-version.outputs.version }}-b${{ needs.check-version.outputs.code }}
          name: Release v${{ needs.check-version.outputs.version }} (build ${{ needs.check-version.outputs.code }})
          make_latest: true
          generate_release_notes: true
          files: |
            app-release-plain.apk
